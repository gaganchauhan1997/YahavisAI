<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>YAHAVIS</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Boot -->
<div id="boot">
  <div id="boot-ring-outer"></div>
  <div id="boot-ring-inner"></div>
  <div id="boot-logo">YAHAVIS</div>
  <div id="boot-tagline">YAHAVI AI SYSTEM · v2.0</div>
  <div id="boot-bar-wrap"><div id="boot-bar"></div></div>
  <div id="boot-msg">Initializing...</div>
</div>

<!-- APP -->
<div id="app" style="display:none">

  <!-- Header -->
  <div id="header">
    <span id="logo">Y<b>A</b>HAVIS</span>
    <span id="hdr-status"><span class="dot"></span> ONLINE</span>
    <span id="hdr-time"></span>
    <button id="menu-btn" onclick="toggleMenu()">☰</button>
  </div>

  <!-- Slide-out menu (mobile) -->
  <div id="side-menu" class="closed">
    <div class="menu-section">API STATUS</div>
    <div id="api-slots-menu"></div>
    <div class="menu-section" style="margin-top:16px">QUICK COMMANDS</div>
    <button class="qb" data-cmd="aaj ke orders batao">📦 Today's Orders</button>
    <button class="qb" data-cmd="aaj ka revenue kitna hai">💰 Revenue</button>
    <button class="qb" data-cmd="shop.hackknow.com ka status check karo">🌐 Site Status</button>
    <button class="qb" data-cmd="system status batao">💻 System Status</button>
    <button class="qb" data-cmd="latest AI news kya hai">📡 AI News</button>
    <button class="qb" data-cmd="kuch motivating bolo Boss mode mein">⚡ Motivate Me</button>
    <div class="menu-section" style="margin-top:16px">SETTINGS</div>
    <label class="tog-row"><span>Auto-Speak (TTS)</span><div class="tog active" id="tts-tog" onclick="toggleTTS()"></div></label>
    <label class="tog-row"><span>Wake Word</span><div class="tog active" id="wake-tog" onclick="toggleWake()"></div></label>
    <button class="qb" style="margin-top:8px" onclick="setGroqKey()">🔑 Set Groq Key</button>
    <button class="qb" onclick="clearChat()">🗑 Clear Chat</button>
    <div id="backend-info" style="margin-top:12px;font-size:10px;color:var(--dim)">Detecting backend...</div>
  </div>
  <div id="menu-overlay" onclick="closeMenu()"></div>

  <!-- Chat area -->
  <div id="chat-area">
    <!-- Arc reactor (top of chat) -->
    <div id="arc-wrap">
      <div id="arc">
        <div class="arc-r r1"></div>
        <div class="arc-r r2"></div>
        <div class="arc-r r3"></div>
        <div id="arc-core">
          <div id="arc-icon">◈</div>
          <div id="arc-lbl">STANDBY</div>
        </div>
      </div>
    </div>

    <!-- Messages -->
    <div id="chat-log"></div>
  </div>

  <!-- Input bar -->
  <div id="input-bar">
    <div id="wave-wrap">
      <div class="wb"></div><div class="wb"></div><div class="wb"></div>
      <div class="wb"></div><div class="wb"></div><div class="wb"></div>
    </div>
    <button id="mic-btn" onclick="toggleVoice()">🎤</button>
    <input id="inp" type="text" placeholder="Type or tap mic to speak..." autocomplete="off" autocorrect="off" autocapitalize="off">
    <button id="send-btn" onclick="submitText()">➤</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
