name: Deploy YAHAVIS to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger from GitHub Actions tab

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers + Pages
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Set Worker Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.GROQ_API_KEY_1 }}" | wrangler secret put GROQ_API_KEY_1
          echo "${{ secrets.GEMINI_API_KEY_1 }}" | wrangler secret put GEMINI_API_KEY_1
          echo "${{ secrets.OPENROUTER_API_KEY }}" | wrangler secret put OPENROUTER_API_KEY
          echo "${{ secrets.WC_SITE_URL }}" | wrangler secret put WC_SITE_URL
          echo "${{ secrets.WC_CONSUMER_KEY }}" | wrangler secret put WC_CONSUMER_KEY
          echo "${{ secrets.WC_CONSUMER_SECRET }}" | wrangler secret put WC_CONSUMER_SECRET

      - name: Upload Static Files to KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Create KV namespaces if they don't exist
          wrangler kv namespace create STATIC_KV --preview false 2>/dev/null || true
          wrangler kv namespace create RATE_KV   --preview false 2>/dev/null || true

          # Upload static files
          wrangler kv key put --namespace-id="$(wrangler kv namespace list | python3 -c "import sys,json; [print(n['id']) for n in json.load(sys.stdin) if n['title']=='yahavis-STATIC_KV']" | head -1)" \
            "index.html" --path ui/index.html || true
          wrangler kv key put --namespace-id="$(wrangler kv namespace list | python3 -c "import sys,json; [print(n['id']) for n in json.load(sys.stdin) if n['title']=='yahavis-STATIC_KV']" | head -1)" \
            "style.css"  --path ui/style.css  || true
          wrangler kv key put --namespace-id="$(wrangler kv namespace list | python3 -c "import sys,json; [print(n['id']) for n in json.load(sys.stdin) if n['title']=='yahavis-STATIC_KV']" | head -1)" \
            "app.js"     --path ui/app.js     || true

      - name: Done
        run: echo "✅ YAHAVIS deployed to yahavis.hackknow.com"
